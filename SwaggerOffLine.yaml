openapi: 3.1.0
info:
  title: Auto Escola 3ESR
  description: |
    API REST para gerenciamento de instruções da auto escola 3ESR.

    **Integrantes**
    - Alexia Ramalho — RM 558385
    - Enzo Real — RM 557943
    - Gustavo Pasquini — RM 555454
    - Hellen Silva — RM 559008
    - Lorenzo Acquesta — RM 557397
  contact:
    name: Auto Escola 3ESR
    email: autoescola3esr@email.com.br
  license:
    name: Apache 2.0
    url: http://springdoc.org
  version: "1.0"
servers:
- url: http://localhost:8081
  description: Generated server url
tags:
- name: Instruções
  description: "Agendamento, consulta e cancelamento de instruções"
- name: Instrutores
  description: CRUD de instrutores da auto escola
- name: Health Check
  description: Verificação de disponibilidade da API
- name: Endereços
  description: Consulta de endereços por CEP via WebService externo ViaCEP
- name: Alunos
  description: CRUD de alunos da auto escola
- name: Autenticação
  description: Login e emissão de token JWT
- name: Usuários
  description: CRUD de usuários da API (somente ADMIN)
paths:
  /usuarios:
    get:
      tags:
      - Usuários
      summary: Listar usuários
      description: "Lista paginada, ordenada por login."
      operationId: listarUsuarios
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "login,ASC"
          items:
            type: string
      responses:
        "200":
          description: Página de usuários
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageDadosListagemUsuario"
        "403":
          description: Sem permissão
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageDadosListagemUsuario"
      security:
      - bearer-key: []
    put:
      tags:
      - Usuários
      summary: Atualizar usuário
      description: Atualiza a senha (gravada em hash) e/ou o perfil.
      operationId: atualizarUsuario
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosAtualizacaoUsuario"
        required: true
      responses:
        "200":
          description: Usuário atualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoUsuario"
        "400":
          description: Dados inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoUsuario"
        "403":
          description: Sem permissão
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoUsuario"
        "404":
          description: Usuário não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoUsuario"
      security:
      - bearer-key: []
    post:
      tags:
      - Usuários
      summary: Cadastrar usuário
      description: "Cria o usuário com a senha gravada em hash BCrypt. Se o perfil\
        \ não for informado, usa USER."
      operationId: cadastrarUsuario
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosCadastroUsuario"
        required: true
      responses:
        "201":
          description: Usuário cadastrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoUsuario"
        "400":
          description: Dados inválidos ou login já cadastrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoUsuario"
        "403":
          description: Sem permissão
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoUsuario"
      security:
      - bearer-key: []
  /instrutores:
    get:
      tags:
      - Instrutores
      summary: Listar instrutores ativos (paginado)
      operationId: listarInstrutores
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "nome,ASC"
          items:
            type: string
      responses:
        "200":
          description: Página de instrutores
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageDadosListagemInstrutor"
        "401":
          description: Token ausente ou inválido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageDadosListagemInstrutor"
        "403":
          description: Sem permissão
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageDadosListagemInstrutor"
      security:
      - bearer-key: []
    put:
      tags:
      - Instrutores
      summary: Atualizar instrutor
      operationId: atualizarInstrutor
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosAtualizacaoInstrutor"
        required: true
      responses:
        "200":
          description: Instrutor atualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoInstrutor"
        "400":
          description: Dados inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoInstrutor"
        "401":
          description: Token ausente ou inválido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoInstrutor"
        "403":
          description: Sem permissão
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoInstrutor"
        "404":
          description: Instrutor não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoInstrutor"
      security:
      - bearer-key: []
    post:
      tags:
      - Instrutores
      summary: Cadastrar instrutor
      operationId: cadastrarInstrutor
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosCadastroInstrutor"
        required: true
      responses:
        "201":
          description: Instrutor cadastrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoInstrutor"
        "400":
          description: Dados inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoInstrutor"
        "401":
          description: Token ausente ou inválido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoInstrutor"
        "403":
          description: Sem permissão
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoInstrutor"
      security:
      - bearer-key: []
  /alunos:
    get:
      tags:
      - Alunos
      summary: Listar alunos ativos (paginado)
      operationId: listarAlunos
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "nome,ASC"
          items:
            type: string
      responses:
        "200":
          description: Página de alunos ativos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageDadosListagemAluno"
        "401":
          description: Não autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageDadosListagemAluno"
        "403":
          description: Sem permissão
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageDadosListagemAluno"
      security:
      - bearer-key: []
    put:
      tags:
      - Alunos
      summary: "Atualizar aluno (nome, email, telefone e endereço)"
      operationId: atualizarAluno
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosAtualizacaoAluno"
        required: true
      responses:
        "200":
          description: Aluno atualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAluno"
        "400":
          description: Dados inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAluno"
        "401":
          description: Não autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAluno"
        "403":
          description: Sem permissão
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAluno"
        "404":
          description: Aluno não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAluno"
      security:
      - bearer-key: []
    post:
      tags:
      - Alunos
      summary: Cadastrar aluno
      operationId: cadastrarAluno
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosCadastroAluno"
        required: true
      responses:
        "201":
          description: Aluno cadastrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAluno"
        "400":
          description: Dados inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAluno"
        "401":
          description: Não autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAluno"
        "403":
          description: Sem permissão
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAluno"
      security:
      - bearer-key: []
  /login:
    post:
      tags:
      - Autenticação
      summary: Efetuar login e obter token JWT
      operationId: efetuarLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosLogin"
        required: true
      responses:
        "200":
          description: Token JWT gerado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosTokenJWT"
        "400":
          description: Dados inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosTokenJWT"
        "401":
          description: Credenciais inválidas
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosTokenJWT"
  /instrucoes:
    get:
      tags:
      - Instruções
      summary: Listar instruções
      description: "Lista paginada ordenada por data/hora. Com ativas=true, traz só\
        \ as não canceladas."
      operationId: listarInstrucoes
      parameters:
      - name: ativas
        in: query
        description: "Quando true, retorna apenas instruções não canceladas"
        required: false
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "dataHora,ASC"
          items:
            type: string
      responses:
        "200":
          description: Página de instruções
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageDadosListagemInstrucao"
        "403":
          description: Sem permissão
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageDadosListagemInstrucao"
      security:
      - bearer-key: []
    post:
      tags:
      - Instruções
      summary: Agendar instrução
      description: "Aplica as regras RN-A1 a RN-A8. Sem id_instrutor, a especialidade\
        \ é obrigatória e o instrutor é escolhido aleatoriamente."
      operationId: agendarInstrucao
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosAgendamento"
        required: true
      responses:
        "200":
          description: Instrução agendada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAgendamento"
        "400":
          description: Dados inválidos ou regra de negócio violada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAgendamento"
        "403":
          description: Sem permissão
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAgendamento"
        "404":
          description: Aluno ou instrutor não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAgendamento"
      security:
      - bearer-key: []
    delete:
      tags:
      - Instruções
      summary: Cancelar instrução
      description: Aplica as regras RN-C1 a RN-C4.
      operationId: cancelarInstrucao
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosCancelamento"
        required: true
      responses:
        "204":
          description: Instrução cancelada
        "400":
          description: Dados inválidos ou regra de negócio violada
        "403":
          description: Sem permissão
        "404":
          description: Instrução não encontrada
      security:
      - bearer-key: []
  /usuarios/{id}:
    get:
      tags:
      - Usuários
      summary: Detalhar usuário
      operationId: detalharUsuario
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Usuário encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoUsuario"
        "403":
          description: Sem permissão
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoUsuario"
        "404":
          description: Usuário não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoUsuario"
      security:
      - bearer-key: []
    delete:
      tags:
      - Usuários
      summary: Excluir usuário
      description: Exclusão física. Não é permitido excluir o próprio usuário logado.
      operationId: excluirUsuario
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Usuário excluído
        "400":
          description: Tentativa de excluir o próprio usuário logado
        "403":
          description: Sem permissão
        "404":
          description: Usuário não encontrado
      security:
      - bearer-key: []
  /instrutores/{id}:
    get:
      tags:
      - Instrutores
      summary: Detalhar instrutor
      operationId: detalharInstrutor
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Instrutor encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoInstrutor"
        "401":
          description: Token ausente ou inválido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoInstrutor"
        "403":
          description: Sem permissão
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoInstrutor"
        "404":
          description: Instrutor não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoInstrutor"
      security:
      - bearer-key: []
    delete:
      tags:
      - Instrutores
      summary: Excluir instrutor (exclusão lógica)
      operationId: excluirInstrutor
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Instrutor excluído
        "401":
          description: Token ausente ou inválido
        "403":
          description: Sem permissão
        "404":
          description: Instrutor não encontrado
      security:
      - bearer-key: []
  /instrucoes/{id}:
    get:
      tags:
      - Instruções
      summary: Detalhar instrução
      description: Inclui o status (AGENDADA ou CANCELADA) e o motivo de cancelamento.
      operationId: detalharInstrucao
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Instrução encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoInstrucao"
        "403":
          description: Sem permissão
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoInstrucao"
        "404":
          description: Instrução não encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoInstrucao"
      security:
      - bearer-key: []
  /health-check:
    get:
      tags:
      - Health Check
      summary: Verificar se a API está no ar
      operationId: healthCheck
      responses:
        "200":
          description: API disponível
          content:
            '*/*':
              schema:
                type: string
  /enderecos/{cep}:
    get:
      tags:
      - Endereços
      summary: Consultar endereço por CEP
      description: "Consulta o endereço no ViaCEP. Aceita o CEP com ou sem hífen (ex.:\
        \ 01001-000 ou 01001000)."
      operationId: consultar
      parameters:
      - name: cep
        in: path
        description: "CEP com 8 dígitos, com ou sem hífen"
        required: true
        schema:
          type: string
        example: 01001-000
      responses:
        "200":
          description: Endereço encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosEndereco"
        "400":
          description: CEP em formato inválido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosEndereco"
        "401":
          description: Não autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosEndereco"
        "403":
          description: Sem permissão
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosEndereco"
        "404":
          description: CEP não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosEndereco"
        "503":
          description: Serviço de CEP indisponível
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosEndereco"
      security:
      - bearer-key: []
  /alunos/{id}:
    get:
      tags:
      - Alunos
      summary: Detalhar aluno
      operationId: detalharAluno
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Aluno encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAluno"
        "401":
          description: Não autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAluno"
        "403":
          description: Sem permissão
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAluno"
        "404":
          description: Aluno não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAluno"
      security:
      - bearer-key: []
    delete:
      tags:
      - Alunos
      summary: Excluir aluno (exclusão lógica)
      operationId: excluirAluno
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Aluno excluído
        "401":
          description: Não autenticado
        "403":
          description: Sem permissão
        "404":
          description: Aluno não encontrado
      security:
      - bearer-key: []
components:
  schemas:
    DadosAtualizacaoUsuario:
      type: object
      properties:
        id:
          type: integer
          format: int64
        senha:
          type: string
          maxLength: 2147483647
          minLength: 6
        perfil:
          type: string
          enum:
          - USER
          - ADMIN
      required:
      - id
    DadosDetalhamentoUsuario:
      type: object
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        perfil:
          type: string
          enum:
          - USER
          - ADMIN
    DadosAtualizacaoInstrutor:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        email:
          type: string
        telefone:
          type: string
        especialidade:
          type: string
          enum:
          - MOTOS
          - CARROS
          - VANS
          - CAMINHOES
        endereco:
          $ref: "#/components/schemas/DadosEndereco"
      required:
      - id
    DadosEndereco:
      type: object
      properties:
        logradouro:
          type: string
          minLength: 1
        numero:
          type: string
        complemento:
          type: string
        bairro:
          type: string
          minLength: 1
        cidade:
          type: string
          minLength: 1
        uf:
          type: string
          minLength: 1
          pattern: "[A-Z]{2}"
        cep:
          type: string
          minLength: 1
          pattern: "[0-9]{5}-[0-9]{3}"
      required:
      - bairro
      - cep
      - cidade
      - logradouro
      - uf
    DadosDetalhamentoInstrutor:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        email:
          type: string
        telefone:
          type: string
        cnh:
          type: string
        especialidade:
          type: string
          enum:
          - MOTOS
          - CARROS
